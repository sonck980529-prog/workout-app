<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f6feb" />
    <title>홈트 & 러닝 트래커</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">🏃 홈트 &amp; 러닝 트래커</h1>
    </header>

    <main id="app" class="app-main">
      <!-- Views are populated by js/app.js -->
      <section id="view-today" class="view" aria-label="오늘 훈련"></section>
      <section id="view-history" class="view" hidden aria-label="기록"></section>
      <section id="view-trends" class="view" hidden aria-label="추이"></section>
    </main>

    <nav class="app-nav" aria-label="주요 화면 이동">
      <button type="button" class="nav-btn is-active" data-view="view-today">오늘 훈련</button>
      <button type="button" class="nav-btn" data-view="view-history">기록</button>
      <button type="button" class="nav-btn" data-view="view-trends">추이</button>
    </nav>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
